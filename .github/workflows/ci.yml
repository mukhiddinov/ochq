name: ci

on:
  push:
    branches: [main]
  pull_request:
  # "Run workflow" button: redeploy main without a new commit.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l . | tee /dev/stderr)"
      - run: go vet ./...
      - run: go test -race ./...

  # Which services this push touches, so a landing-page change never
  # restarts people's tunnels and vice versa. "Run workflow" deploys both.
  changes:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      ochqd: ${{ steps.diff.outputs.ochqd }}
      web: ${{ steps.diff.outputs.web }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: diff
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" != push || -z "$BEFORE" || "$BEFORE" =~ ^0+$ ]] ||
              ! files=$(git diff --name-only "$BEFORE" "$GITHUB_SHA"); then
            echo "ochqd=true" >> "$GITHUB_OUTPUT"
            echo "web=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf '%s\n' "$files"
          shared='^(pkg/|go\.mod$|go\.sum$)'
          grep -qE "^(cmd/ochqd/|internal/(server|proto|tlsutil)/)|$shared" <<<"$files" &&
            echo "ochqd=true" >> "$GITHUB_OUTPUT" || echo "ochqd=false" >> "$GITHUB_OUTPUT"
          grep -qE "^(cmd/ochq-web/|internal/(web|ui)/|web/)|$shared" <<<"$files" &&
            echo "web=true" >> "$GITHUB_OUTPUT" || echo "web=false" >> "$GITHUB_OUTPUT"

  deploy:
    needs: [test, changes]
    # Only main, only when ochqd changed, and only once DEPLOY_HOST is set.
    if: needs.changes.outputs.ochqd == 'true' && vars.DEPLOY_HOST != ''
    runs-on: ubuntu-latest
    environment: production
    # Never run two deploys at once; queue them instead.
    concurrency:
      group: production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Build ochqd
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: ${{ vars.DEPLOY_ARCH || 'amd64' }}
        run: |
          VERSION="${GITHUB_SHA::12}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          go build -trimpath \
            -ldflags "-s -w -X github.com/mukhiddinov/ochq/pkg/version.Version=$VERSION" \
            -o ochqd ./cmd/ochqd

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # Pinned host key: refuse to talk to anything pretending to be our VPS.
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Deploy
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '22' }}
        run: |
          # The deploy key's forced command runs `ochq-deploy $VERSION`
          # and reads the binary from stdin.
          ssh -o BatchMode=yes -p "$DEPLOY_PORT" "ochq_deploy@$DEPLOY_HOST" "$VERSION" < ochqd

  deploy-web:
    needs: [test, changes]
    if: needs.changes.outputs.web == 'true' && vars.DEPLOY_HOST != ''
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: production-web
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # tags: the install demo shows the latest release
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Build ochq-web
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: ${{ vars.DEPLOY_ARCH || 'amd64' }}
        run: |
          VERSION="${GITHUB_SHA::12}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          RELEASE=$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || echo dev)
          go build -trimpath \
            -ldflags "-s -w -X github.com/mukhiddinov/ochq/pkg/version.Version=$RELEASE" \
            -o ochq-web ./cmd/ochq-web

      - name: Configure SSH
        env:
          WEB_DEPLOY_SSH_KEY: ${{ secrets.WEB_DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$WEB_DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Deploy
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '22' }}
        run: |
          # The key's forced command runs `ochq-web-deploy $VERSION` and
          # reads the binary from stdin.
          ssh -o BatchMode=yes -p "$DEPLOY_PORT" "ochq_web_deploy@$DEPLOY_HOST" "$VERSION" < ochq-web
